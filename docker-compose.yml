# Local Postgres for development and tests. Production uses Neon.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moveo
      POSTGRES_PASSWORD: moveo
      POSTGRES_DB: moveo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
